<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Polly Autogen GUI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Polly Autogen GUI</h1>

  <section class="settings-section">
    <h2>設定</h2>
    <div class="aws-account-buttons">
      <button id="aws-account-settings-btn">AWSアカウントの設定</button>
      <button id="aws-credentials-edit-btn">設定ファイルを編集</button>
    </div>
    <p class="region-note">リージョン: ap-northeast-1(固定)</p>
  </section>

  <section class="excel-section">
    <h2>台本(Excel)からテキストを作成</h2>
    <div class="target-buttons">
      <button id="select-excel-btn">Excelファイルを選択</button>
      <button id="open-workfolder-btn">作業フォルダを開く</button>
    </div>
  </section>

  <div class="card audio-card">
  <section class="target-section">
    <h2>ファイルまたはフォルダから音声出力</h2>
    <div class="target-buttons">
      <button id="select-file-btn">TXTファイルを選択</button>
      <button id="select-directory-btn">TEXTフォルダを選択</button>
    </div>
    <input id="target-path" type="text" readonly placeholder="未選択" />
  </section>

  <section class="options-section">
    <div class="field">
      <label for="language-code">Language Code</label>
      <select id="language-code" autocomplete="off"></select>
    </div>
    <div class="field">
      <label for="engine">Engine</label>
      <select id="engine" autocomplete="off"></select>
    </div>
    <div class="field">
      <label for="voice-id">Voice ID</label>
      <select id="voice-id" autocomplete="off"></select>
    </div>
    <div class="field">
      <label for="output-format">Output Format</label>
      <select id="output-format">
        <option value="mp3" selected>mp3</option>
        <option value="ogg_vorbis">ogg_vorbis</option>
        <option value="pcm">pcm</option>
      </select>
    </div>
  </section>

  <section class="run-section">
    <button id="convert-btn" disabled>変換開始</button>
    <button id="reload-voices-btn">音声一覧を再取得</button>
    <button id="save-voice-settings-btn">現在の音声設定を保存する</button>
    <span id="overall-progress"></span>
  </section>

  <section class="progress-section">
    <ul id="file-list"></ul>
  </section>
  </div>

  <section class="pptx-section">
    <h2>PowerPointへの音声埋め込み</h2>
    <div class="pptx-row">
      <button id="select-pptx-btn">PowerPointファイルを選択</button>
      <span id="pptx-file-label" class="pptx-file-label"></span>
      <button id="select-mp3-folder-btn">MP3フォルダを指定</button>
      <span id="mp3-folder-label" class="path-label"></span>
    </div>
    <div class="run-section">
      <button id="embed-audio-btn" disabled>音声を埋め込む</button>
      <span id="embed-progress"></span>
    </div>
  </section>

  <section class="log-section">
    <h2>ログ</h2>
    <pre id="log"></pre>
  </section>

  <dialog id="aws-credentials-dialog">
    <form method="dialog">
      <h2>AWSアカウントの設定</h2>
      <div class="field">
        <label for="aws-access-key-input">Access Key ID</label>
        <input id="aws-access-key-input" type="text" autocomplete="off" />
      </div>
      <div class="field">
        <label for="aws-secret-key-input">Secret Access Key</label>
        <input id="aws-secret-key-input" type="text" autocomplete="off" />
      </div>
      <div class="dialog-buttons">
        <button type="button" id="aws-credentials-cancel-btn">キャンセル</button>
        <button type="submit" id="aws-credentials-save-btn" value="save">保存</button>
      </div>
    </form>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
