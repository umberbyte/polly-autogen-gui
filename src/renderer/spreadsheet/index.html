<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>トークスクリプト編集</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="voice-settings-label" class="voice-settings-label"></div>

  <div class="toolbar">
    <span id="working-folder-label"></span>
    <button id="save-btn">保存</button>
    <button id="batch-generate-btn">一括音声出力</button>
    <button id="batch-cancel-btn" hidden>中止</button>
    <span id="batch-progress"></span>
    <span id="status"></span>
  </div>

  <table id="script-table">
    <thead>
      <tr>
        <th class="page-number-col">ページ番号</th>
        <th>トークスクリプト</th>
        <th class="actions-col">操作</th>
      </tr>
    </thead>
    <tbody id="script-table-body"></tbody>
  </table>

  <dialog id="edit-dialog">
    <form method="dialog">
      <div id="edit-textarea" class="edit-textarea" contenteditable="true" spellcheck="false"></div>
      <p class="edit-hint">テキストを選択して右クリックすると再生速度を設定できます。設定済み箇所は右クリックで変更・解除できます。</p>
      <div class="dialog-buttons">
        <button type="button" id="edit-cancel-btn">キャンセル</button>
        <button type="submit" id="edit-ok-btn" value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="ssml-context-menu" class="ssml-context-menu" hidden>
    <div class="ssml-menu-title">再生速度を設定</div>
    <div class="ssml-menu-presets">
      <button type="button" data-rate="50">50%</button>
      <button type="button" data-rate="75">75%</button>
      <button type="button" data-rate="90">90%</button>
      <button type="button" data-rate="110">110%</button>
      <button type="button" data-rate="125">125%</button>
      <button type="button" data-rate="150">150%</button>
      <button type="button" data-rate="200">200%</button>
    </div>
    <div class="ssml-menu-custom">
      <input type="number" id="ssml-rate-input" min="20" max="200" step="1" placeholder="任意の%" />
      <button type="button" id="ssml-rate-apply">適用</button>
    </div>
    <button type="button" id="ssml-rate-remove" class="ssml-menu-remove" hidden>タグを解除</button>
  </div>

  <audio id="audio-player"></audio>

  <script src="spreadsheet.js"></script>
</body>
</html>
